# Certificate Authority Configuration File

# CA Certificate and Key Paths
ca_cert_path = certs/ca.crt
ca_key_path = certs/ca.key
crl_path = certs/ca.crl

# Database Configuration
db_path = certs/ca.db

# Directory Configuration
certs_dir = certs
keys_dir = certs

# Server Configuration
port = 8080

# Certificate Configuration
key_size = 4096
validity_years = 10

# Security Settings
# Minimum key size for client certificates
min_key_size = 2048

# Maximum validity period for client certificates (days)
max_validity_days = 3650

# Allowed countries (comma-separated, empty for all)
allowed_countries = KR

# Logging
log_level = INFO
log_file = ca.log
